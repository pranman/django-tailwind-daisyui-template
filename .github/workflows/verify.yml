name: Verify starter

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  starter:
    name: Starter (${{ matrix.id }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-py312-node22-uv
            os: ubuntu-24.04
            python: '3.12'
            node: '22'
            installer: uv
            arguments: --cold
          - id: linux-py314-node24-pip-browser
            os: ubuntu-24.04
            python: '3.14'
            node: '24'
            installer: pip
            arguments: --cold --browser
          - id: macos-py313-node24-uv
            os: macos-15
            python: '3.13'
            node: '24'
            installer: uv
            arguments: ''
          - id: windows-py313-node22-pip
            os: windows-2025
            python: '3.13'
            node: '22'
            installer: pip
            arguments: ''
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.6'
          enable-cache: false
      - name: Check dependency lock and pip exports
        if: matrix.id == 'linux-py312-node22-uv'
        run: python scripts/check_dependencies.py --exports-only
      - name: Verify public setup, development and deployment workflows
        run: python scripts/verify_starter.py --installer ${{ matrix.installer }} ${{ matrix.arguments }} --artifacts verification-artifacts
      - name: Retain safe verification diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: starter-${{ matrix.id }}
          path: verification-artifacts/
          retention-days: 7
          if-no-files-found: warn

  required:
    name: Starter verification
    if: always()
    needs: [starter]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require every supported workflow lane
        env:
          MATRIX_RESULT: ${{ needs.starter.result }}
        run: test "$MATRIX_RESULT" = success
